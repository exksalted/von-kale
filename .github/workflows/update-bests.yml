name: Update best records

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC (after Update DB's 03:00 run)
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season codes, space-separated, e.g. '0,0 1,18' (empty = 0,0)"
        type: string
        default: ""
      lakes:
        description: "Lake IDs, space- or comma-separated, e.g. '3 12 27' (empty = all lakes)"
        type: string
        default: ""

permissions:
  contents: write

# Same group as update-db.yml: both replace the single DB release asset, so they must never overlap.
concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEASONS: ${{ inputs.seasons }}
      LAKES: ${{ inputs.lakes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          seasons=$(printf '%s\n' $SEASONS | awk '!seen[$0]++' | paste -sd' ')
          seasons="${seasons:-0,0}"
          for s in $seasons; do
            [[ "$s" =~ ^[0-9]+,[0-9]+$ ]] || { echo "Season must look like 0,0 (got '$s')"; exit 1; }
          done
          lakes=$(printf '%s\n' ${LAKES//,/ } | awk '!seen[$0]++' | paste -sd,)
          if [ -n "$lakes" ] && ! [[ "$lakes" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "Lakes must be numbers separated by spaces or commas (got '$LAKES')"; exit 1
          fi
          echo "Seasons: $seasons | Lakes: ${lakes:-all}"
          echo "SEASONS=$seasons" >> "$GITHUB_ENV"
          echo "LAKES=$lakes" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Unlike Update DB there is no "fresh start": uploading a DB without the records tables would break the site.
      - name: Download previous DB
        run: |
          gh release view db-latest >/dev/null 2>&1 || { echo "No db-latest release; run Update DB first."; exit 1; }
          gh release download db-latest --pattern pp2_00.db --clobber

      # Any failure stops the job before the upload, so a half-updated DB is never published.
      - name: Scrape best records
        run: |
          for P in $SEASONS; do
            echo "::group::Season $P"
            SEASON="$P" python bests.py
            echo "::endgroup::"
          done

      - name: Check new DB
        run: |
          test "$(sqlite3 pp2_00.db 'PRAGMA integrity_check')" = "ok"
          n=$(sqlite3 pp2_00.db 'SELECT COUNT(*) FROM records')
          [ "$n" -gt 0 ] || { echo "records table is empty"; exit 1; }
          sqlite3 pp2_00.db 'SELECT Season, COUNT(*) FROM bestrecords GROUP BY Season' || true

      - uses: actions/upload-artifact@v4
        with:
          name: pp2_00-db-backup
          path: pp2_00.db
          retention-days: 30

      - name: Upload DB
        run: gh release upload db-latest pp2_00.db --clobber

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
