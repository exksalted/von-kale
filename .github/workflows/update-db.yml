name: Update DB

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      nicks:
        description: "Comma-separated nicks (empty = defaults in config.py)"
        type: string
        default: ""
      seasons:
        description: "Season codes, space-separated, e.g. '0,0 1,18' (empty = 0,0)"
        type: string
        default: ""
      lakes:
        description: "Lake IDs, space- or comma-separated, e.g. '3 12 27' (empty = all lakes)"
        type: string
        default: ""
      skip_totals:
        description: "Skip totals.py; run records.py on top of the DB from the latest release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NICKS: ${{ inputs.nicks }}
      SEASONS: ${{ inputs.seasons }}
      LAKES: ${{ inputs.lakes }}
      SKIP_TOTALS: ${{ inputs.skip_totals }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          seasons=$(printf '%s\n' $SEASONS | awk '!seen[$0]++' | paste -sd' ')
          seasons="${seasons:-0,0}"
          for s in $seasons; do
            [[ "$s" =~ ^[0-9]+,[0-9]+$ ]] || { echo "Season must look like 0,0 (got '$s')"; exit 1; }
          done
          lakes=$(printf '%s\n' ${LAKES//,/ } | awk '!seen[$0]++' | paste -sd,)
          if [ -n "$lakes" ] && ! [[ "$lakes" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "Lakes must be numbers separated by spaces or commas (got '$LAKES')"; exit 1
          fi
          echo "Seasons: $seasons | Lakes: ${lakes:-all}"
          echo "SEASONS=$seasons" >> "$GITHUB_ENV"
          echo "LAKES=$lakes" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download previous DB
        run: |
          if gh release view db-latest >/dev/null 2>&1; then
            gh release download db-latest --pattern pp2_00.db --clobber
          elif [ "$SKIP_TOTALS" = "true" ]; then
            echo "skip_totals set but no db-latest release exists"; exit 1
          else
            echo "First run: no previous DB, starting fresh"
          fi

      - name: Check totals exist
        if: ${{ inputs.skip_totals }}
        run: |
          for P in $SEASONS; do
            S="${P//,/_}"
            if [ -n "$LAKES" ]; then
              want=$(echo "$LAKES" | tr ',' '\n' | sort -u | wc -l)
              n=$(sqlite3 pp2_00.db "SELECT COUNT(DISTINCT Lake_ID) FROM totalrecords WHERE Season='$S' AND Lake_ID IN ($LAKES)" 2>/dev/null || echo 0)
            else
              want=1
              n=$(sqlite3 pp2_00.db "SELECT COUNT(*) FROM totalrecords WHERE Season='$S'" 2>/dev/null || echo 0)
            fi
            [ "$n" -ge "$want" ] || { echo "Missing totalrecords for season $S (lakes: ${LAKES:-all}) in the previous DB; run without skip_totals first."; exit 1; }
          done

      # Any failure stops the whole job before the upload, so a half-updated DB is never published.
      - name: Scrape
        run: |
          for P in $SEASONS; do
            echo "::group::Season $P"
            if [ "$SKIP_TOTALS" != "true" ]; then SEASON="$P" python totals.py; fi
            SEASON="$P" python records.py
            echo "::endgroup::"
          done

      - name: Check new DB
        run: |
          test "$(sqlite3 pp2_00.db 'PRAGMA integrity_check')" = "ok"
          n=$(sqlite3 pp2_00.db 'SELECT COUNT(*) FROM records')
          [ "$n" -gt 0 ] || { echo "records table is empty"; exit 1; }

      # Safety net: the release upload below replaces the only copy of the DB.
      - uses: actions/upload-artifact@v4
        with:
          name: pp2_00-db-backup
          path: pp2_00.db
          retention-days: 30

      - name: Upload DB
        run: |
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --title "Latest DB" --notes "Auto-updated"
          gh release upload db-latest pp2_00.db --clobber

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
