name: Update DB

on:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      nicks:
        description: "Comma-separated nicks (empty = defaults in config.py)"
        type: string
        default: ""
      season:
        description: "Season code (empty = 0,0)"
        type: string
        default: ""
      skip_totals:
        description: "Skip totals.py; run records.py on top of the DB from the latest release"
        type: boolean
        default: false
      deploy_only:
        description: "Skip scraping; redeploy site using the DB from the latest release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NICKS: ${{ inputs.nicks }}
      SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate season
        if: ${{ !inputs.deploy_only }}
        run: |
          if [ -n "$SEASON" ] && ! [[ "$SEASON" =~ ^[0-9]+,[0-9]+$ ]]; then
            echo "Season must look like 0,0"; exit 1
          fi

      - uses: actions/setup-python@v5
        if: ${{ !inputs.deploy_only }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ !inputs.deploy_only }}

      - name: Download previous DB
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          SKIP_TOTALS: ${{ inputs.skip_totals }}
        run: |
          if gh release view db-latest >/dev/null 2>&1; then
            gh release download db-latest --pattern pp2_00.db --clobber
          elif [ "$DEPLOY_ONLY" = "true" ] || [ "$SKIP_TOTALS" = "true" ]; then
            echo "deploy_only/skip_totals set but no db-latest release exists"; exit 1
          else
            echo "First run: no previous DB, starting fresh"
          fi
          
      - name: Check totals exist
        if: ${{ inputs.skip_totals && !inputs.deploy_only }}
        run: |
          S="${SEASON:-0,0}"; S="${S//,/_}"
          n=$(sqlite3 pp2_00.db "SELECT COUNT(*) FROM totalrecords WHERE Season='$S'" 2>/dev/null || echo 0)
          [ "$n" -gt 0 ] || { echo "No totalrecords for season $S in the previous DB; run without skip_totals first."; exit 1; }

      - run: python totals.py
        if: ${{ !inputs.deploy_only && !inputs.skip_totals }}
      - run: python records.py
        if: ${{ !inputs.deploy_only }}

      - name: Upload DB
        if: ${{ !inputs.deploy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --title "Latest DB" --notes "Auto-updated"
          gh release upload db-latest pp2_00.db --clobber

      - name: Build site
        run: |
          test -f pp2_00.db
          mkdir -p _site
          cp -r site/. _site/
          cp pp2_00.db _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
