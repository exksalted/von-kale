name: Update DB

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip scraping; redeploy site using the DB from the latest release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ !inputs.deploy_only }}
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: ${{ !inputs.deploy_only }}

      - name: Download previous DB
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
        run: |
          if gh release view db-latest >/dev/null 2>&1; then
            gh release download db-latest --pattern pp2_00.db --clobber
          elif [ "$DEPLOY_ONLY" = "true" ]; then
            echo "deploy_only set but no db-latest release exists"; exit 1
          else
            echo "First run: no previous DB, starting fresh"
          fi

      - run: python totals.py
        if: ${{ !inputs.deploy_only }}
      - run: python records.py
        if: ${{ !inputs.deploy_only }}

      - name: Upload DB
        if: ${{ !inputs.deploy_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --title "Latest DB" --notes "Auto-updated"
          gh release upload db-latest pp2_00.db --clobber

      - name: Build site
        run: |
          test -f pp2_00.db
          mkdir -p _site
          cp site/index.html pp2_00.db _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
