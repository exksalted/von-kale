<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Von-Kale records matrix</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <h1>Records matrix</h1>
  <section class="panel">
    <div class="controls">
      <select id="season" aria-label="Season"></select>
      <select id="lake" aria-label="Lake"></select>
    </div>
    <div class="bar"><div id="status" role="status">Loading database…</div></div>
  </section>
  <div class="lakes" id="grid"></div>
</main>

<script defer
  src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"
  integrity="sha384-8D3Rsfo535FqoC1pHCCQMrNf75UgzyoG/HQm9zOzITRrz3QKzecc2E7JXKGCXoWu"
  crossorigin="anonymous"></script>
<script type="module" src="matrix.js"></script>
</body>
</html>
