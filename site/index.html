<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Von-Kale records</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #131720;
    --surface-2: #1a1f2b;
    --border: #262c3a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #8b5cf6;
    --err: #ff6b7a;
    --ok: #4ade80;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 400px at 10% -10%, #1b2a5544, transparent),
      radial-gradient(700px 400px at 100% 0%, #3b1d6a33, transparent),
      var(--bg);
    min-height: 100vh;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 {
    margin: 0 0 1.25rem; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, #9db6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem;
    box-shadow: 0 10px 30px #0006;
  }
  select, textarea, button { font: inherit; color: var(--text); }
  select {
    width: 100%; margin-bottom: .75rem; padding: .6rem .8rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; outline: none;
  }
  textarea {
    width: 100%; height: 9.5rem; padding: .8rem .9rem; resize: vertical;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: #0d1017; border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #5b8cff26; }
  .bar { display: flex; align-items: center; gap: 1rem; margin-top: .75rem; }
  button {
    padding: .55rem 1.3rem; border: 0; border-radius: 10px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 14px #5b8cff44; transition: transform .1s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  #status { color: var(--muted); font-size: 13px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  .wrap {
    margin-top: 1.25rem; overflow: clip;
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  }
  .wrap:empty { display: none; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: .6rem .9rem; text-align: left; }
  th {
    position: sticky; top: 0; z-index: 1; backdrop-filter: blur(8px);
    background: var(--surface-2); color: var(--muted);
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid #ffffff0a; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #5b8cff12; }
  .num { text-align: right; }
  td.nick { font-weight: 600; color: #c9d6ff; }
</style>
</head>
<body>
<main>
<h1>Team Von-Kale records</h1>
<section class="panel">
  <select id="presets"></select>
  <textarea id="sql" spellcheck="false"></textarea>
  <div class="bar">
    <button id="run" disabled>Run</button>
    <div id="status">Loading database…</div>
  </div>
</section>
<div class="wrap" id="out"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const PRESETS = {
  "Latest records": "SELECT Date, Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score\nFROM records\nWHERE Season = '0_0'\nORDER BY Date DESC, Score DESC\nLIMIT 50;",
  "Best fishes of all time": "SELECT Date, Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score\nFROM records\nWHERE Fish_ID < 100 AND Season = '0_0'\nORDER BY Score DESC\nLIMIT 50;",
  "Best competition scores of all time": "SELECT Date, Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score\nFROM records\nWHERE Fish_ID > 100 AND Season = '0_0'\nORDER BY Score DESC\nLIMIT 50;",
  "All team records": "SELECT Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score, Date FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY Lake, Type ORDER BY Score DESC) AS rn FROM records r) t WHERE rn = 1 AND Season = '0_0' ORDER BY Lake, Type;",
  "Total fish score": "SELECT Nick, ROUND(SUM(Score), 2) AS Score FROM records WHERE Fish_ID < 100 AND Season = '0_0' GROUP BY Nick ORDER BY Score DESC;",
  "Total competition score": "SELECT Nick, ROUND(SUM(Score), 2) AS Score FROM records WHERE Fish_ID > 100 AND Season = '0_0' GROUP BY Nick ORDER BY Score DESC;"
};

const sel = document.getElementById("presets");
const box = document.getElementById("sql");
const status = document.getElementById("status");
const out = document.getElementById("out");
const runBtn = document.getElementById("run");
let db;

for (const name of Object.keys(PRESETS)) sel.add(new Option(name));
box.value = PRESETS[sel.value];
sel.onchange = () => { box.value = PRESETS[sel.value]; };

function render(res, ms) {
  out.replaceChildren();
  if (!res.length) { status.className = "ok"; status.textContent = "Query OK, no rows."; return; }
  const { columns, values } = res[0];
  const table = document.createElement("table");
  const thead = table.createTHead().insertRow();
  columns.forEach((c, i) => {
    const th = document.createElement("th");
    th.textContent = c;
    if (typeof values[0]?.[i] === "number") th.className = "num";
    thead.appendChild(th);
  });
  const tbody = table.createTBody();
  values.forEach(r => {
    const tr = tbody.insertRow();
    r.forEach((v, i) => {
      const td = tr.insertCell();
      td.textContent = v === null ? "NULL" : v;
      if (typeof v === "number") td.className = "num";
      if (columns[i] === "Nick") td.className = "nick";
    });
  });
  out.appendChild(table);
  status.className = "ok";
  status.textContent = `${values.length} rows · ${ms} ms`;
}

function run() {
  status.className = "";
  try {
    const t = performance.now();
    const res = db.exec(box.value);
    render(res, Math.round(performance.now() - t));
  } catch (e) { status.className = "err"; status.textContent = e.message; out.replaceChildren(); }
}

(async () => {
  try {
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    const resp = await fetch("pp2_00.db");
    if (!resp.ok) throw new Error(`DB download failed (${resp.status})`);
    db = new SQL.Database(new Uint8Array(await resp.arrayBuffer()));
    runBtn.disabled = false;
    runBtn.onclick = run;
    box.addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") run(); });
    status.textContent = "Ready. Ctrl+Enter runs the query.";
  } catch (e) {
    status.className = "err";
    status.textContent = e.message;
  }
})();
</script>
</body>
</html>
