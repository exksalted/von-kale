<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Von-Kale records</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <h1>Team Von-Kale records</h1>
  <section class="panel">
  <div class="controls">
    <select id="presets" aria-label="Preset query"></select>
    <select id="f-Nick" aria-label="Player"></select>
    <select id="f-Lake" aria-label="Lake"></select>
    <select id="f-Type" aria-label="Type"></select>
    <select id="f-Season" aria-label="Season"></select>
  </div>
  <details>
    <summary>Advanced: edit SQL</summary>
    <textarea id="sql" spellcheck="false" aria-label="SQL query"></textarea>
    <div class="bar">
      <button class="btn" id="run" type="button" disabled>Run</button>
      <span class="hint">Ctrl/⌘ + Enter runs the query</span>
    </div>
  </details>
  <div class="bar">
    <div id="status" role="status">Loading database…</div>
    <button class="btn" id="export" type="button" disabled>Export CSV</button>
  </div>
</section>
  <div id="out"></div>
</main>

<script defer
  src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"
  integrity="sha384-8D3Rsfo535FqoC1pHCCQMrNf75UgzyoG/HQm9zOzITRrz3QKzecc2E7JXKGCXoWu"
  crossorigin="anonymous"></script>
<script type="module" src="index.js"></script>
</body>
</html>
