<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PP2 records</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 1100px; }
  textarea { width: 100%; height: 9rem; font-family: monospace; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #8884; padding: 4px 8px; text-align: left; }
  #status { margin: .5rem 0; }
  .err { color: #c00; }
</style>
</head>
<body>
<h1>PP2 records</h1>
<select id="presets"></select>
<textarea id="sql"></textarea>
<button id="run" disabled>Run</button>
<div id="status">Loading database…</div>
<div class="wrap" id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const PRESETS = {
  "Best fishes of all time": "SELECT Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score, Date\nFROM records\nWHERE Fish_ID < 100 AND Season = '0_0'\nORDER BY Score DESC\nLIMIT 50;",
  "Best competition scores of all time": "SELECT Nick, Lake, Type, Weight, Rank, Out-Of, ROUND(Score, 2) AS Score, Date\nFROM records\nWHERE Fish_ID > 100 AND Season = '0_0'\nORDER BY Score DESC\nLIMIT 50;",
  "All team records": "SELECT Nick, Lake, Type, Weight, Rank, Out_Of, ROUND(Score, 2) AS Score, Date\nFROM records\nWHERE Weight = MAX(Weight) GROUP BY Lake, Type\nORDER BY Lake, Type;",
  "List of seasons": "SELECT Season, COUNT(*) AS Rows FROM records GROUP BY Season;",
  "Tables": "SELECT name, sql FROM sqlite_master WHERE type = 'table';"
};

const sel = document.getElementById("presets");
const box = document.getElementById("sql");
const status = document.getElementById("status");
const out = document.getElementById("out");
const runBtn = document.getElementById("run");
let db;

for (const name of Object.keys(PRESETS)) sel.add(new Option(name));
box.value = PRESETS[sel.value];
sel.onchange = () => { box.value = PRESETS[sel.value]; };

function render(res) {
  out.replaceChildren();
  if (!res.length) { status.textContent = "Query OK, no rows."; return; }
  const { columns, values } = res[0];
  const table = document.createElement("table");
  const head = table.insertRow();
  columns.forEach(c => { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); });
  values.forEach(r => {
    const tr = table.insertRow();
    r.forEach(v => { tr.insertCell().textContent = v === null ? "NULL" : v; });
  });
  out.appendChild(table);
  status.textContent = `${values.length} rows`;
}

function run() {
  status.className = "";
  try { render(db.exec(box.value)); }
  catch (e) { status.className = "err"; status.textContent = e.message; out.replaceChildren(); }
}

(async () => {
  try {
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    const resp = await fetch("pp2_00.db");
    if (!resp.ok) throw new Error(`DB download failed (${resp.status})`);
    db = new SQL.Database(new Uint8Array(await resp.arrayBuffer()));
    runBtn.disabled = false;
    runBtn.onclick = run;
    box.addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") run(); });
    status.textContent = "Ready. Ctrl+Enter runs the query.";
  } catch (e) {
    status.className = "err";
    status.textContent = e.message;
  }
})();
</script>
</body>
</html>
