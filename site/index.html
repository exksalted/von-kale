<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Von-Kale records</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --surface: #131720;
    --surface-2: #1a1f2b;
    --border: #262c3a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #8b5cf6;
    --err: #ff6b7a;
    --ok: #4ade80;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 400px at 10% -10%, #1b2a5544, transparent),
      radial-gradient(700px 400px at 100% 0%, #3b1d6a33, transparent),
      var(--bg);
    min-height: 100vh;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 {
    margin: 0 0 1.25rem; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, #9db6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem;
    box-shadow: 0 10px 30px #0006;
  }
  select, textarea, button { font: inherit; color: var(--text); }
  select {
    width: 100%; padding: .6rem .8rem;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; outline: none;
  }
  textarea {
    width: 100%; height: 9.5rem; padding: .8rem .9rem; resize: vertical;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: #0d1017; border: 1px solid var(--border); border-radius: 10px; outline: none;
  }
  select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #5b8cff26; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; margin-bottom: .75rem; }
  .controls #presets { grid-column: 1 / -1; }
  details { margin-top: .25rem; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; padding: .2rem 0; }
  summary:hover { color: var(--text); }
  details textarea { margin-top: .5rem; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th[data-dir="asc"]::after { content: " \25B2"; color: var(--accent); }
  th[data-dir="desc"]::after { content: " \25BC"; color: var(--accent); }
  .name { cursor: pointer; transition: filter .12s; }
  .name:hover { filter: brightness(1.25); }
  .bar { display: flex; align-items: center; gap: 1rem; margin-top: .75rem; }
  button {
    padding: .55rem 1.3rem; border: 0; border-radius: 10px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 14px #5b8cff44; transition: transform .1s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  #status { color: var(--muted); font-size: 13px; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }
  .wrap {
    margin-top: 1.25rem; overflow: clip;
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface);
  }
  .wrap:empty { display: none; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: .6rem .9rem; text-align: left; }
  th {
    position: sticky; top: 0; z-index: 1; backdrop-filter: blur(8px);
    background: var(--surface-2); color: var(--muted);
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid #ffffff0a; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #5b8cff12; }
  .num { text-align: right; }
  td.nick { font-weight: 700; }
  .score {
    --c: #8b93a7;
    display: inline-block; min-width: 3.6rem; padding: .1rem .6rem; border-radius: 8px;
    font-weight: 700; color: var(--c);
    background: color-mix(in srgb, var(--c) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--c) 50%, transparent);
  }
  .name {
    --c: #c9d6ff;
    display: inline-block; padding: .1rem .6rem; border-radius: 999px;
    color: var(--c); letter-spacing: .01em;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    text-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent);
  }
</style>
</head>
<body>
<main>
<h1>Team Von-Kale records</h1>
<section class="panel">
  <div class="controls">
    <select id="presets"></select>
    <select id="f-Nick"></select>
    <select id="f-Lake"></select>
    <select id="f-Type"></select>
  </div>
  <details>
    <summary>Advanced: edit SQL</summary>
    <textarea id="sql" spellcheck="false"></textarea>
    <div class="bar"><button id="run" disabled>Run</button><span style="color:var(--muted);font-size:13px">Ctrl+Enter runs the query</span></div>
  </details>
  <div class="bar"><div id="status">Loading database…</div></div>
</section>
<div class="wrap" id="out"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const COLS = "Date, Nick, Lake, Type, Weight || ' g' AS Weight, Rank, Out_Of, ROUND(Score, 2) AS Score";
const PRESETS = {
  "Latest records": f => `SELECT ${COLS}\nFROM records\nWHERE Season = '0_0'${f}\nORDER BY Date DESC, Score DESC\nLIMIT 50;`,
  "Best fishes of all time": f => `SELECT ${COLS}\nFROM records\nWHERE Fish_ID < 100 AND Season = '0_0'${f}\nORDER BY Score DESC\nLIMIT 50;`,
  "Best competition scores of all time": f => `SELECT ${COLS}\nFROM records\nWHERE Fish_ID > 100 AND Season = '0_0'${f}\nORDER BY Score DESC\nLIMIT 50;`,
  "All team records": f => `SELECT Nick, Lake, Type, Weight || ' g' AS Weight, Rank, Out_Of, ROUND(Score, 2) AS Score, Date\nFROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY Lake, Type ORDER BY Score DESC) AS rn\n      FROM records r WHERE Season = '0_0'${f}) t\nWHERE rn = 1\nORDER BY Lake, Type;`,
  "Total fish score": f => `SELECT Nick, ROUND(SUM(Score), 2) AS Score FROM records\nWHERE Fish_ID < 100 AND Season = '0_0'${f}\nGROUP BY Nick ORDER BY Score DESC;`,
  "Total competition score": f => `SELECT Nick, ROUND(SUM(Score), 2) AS Score FROM records\nWHERE Fish_ID > 100 AND Season = '0_0'${f}\nGROUP BY Nick ORDER BY Score DESC;`
};

const NAME_COLORS = {
  "liilu:3": "#a30465",
  "pumpkin": "#FF7518",
  "exksa": "#7ba63f",
  "kuhasalaliitto": "#6495ED"
};

// Lower bound inclusive; first match from the top wins.
const SCORE_TIERS = [
  [100, "#DC2367"],
  [50,  "#E03030"],
  [10,  "#D35400"],
  [5,   "#F1C40F"],
  [3,   "#7D3C98"],
  [2,   "#2471A3"],
  [1,   "#27AE60"],
  [0.3, "#C5CAD3"],
  [-Infinity, "#565c68"]
];
const scoreColor = v => SCORE_TIERS.find(([min]) => v >= min)[1];

const sel = document.getElementById("presets");
const box = document.getElementById("sql");
const status = document.getElementById("status");
const out = document.getElementById("out");
const runBtn = document.getElementById("run");
let db;

const FILTERS = { Nick: "players", Lake: "lakes", Type: "types" };
const fsel = Object.fromEntries(Object.keys(FILTERS).map(c => [c, document.getElementById("f-" + c)]));
let last = null, sort = { col: -1, dir: "asc" };

for (const name of Object.keys(PRESETS)) sel.add(new Option(name));
const esc = v => v.replace(/'/g, "''");
const filt = () => Object.keys(FILTERS).map(c => fsel[c].value ? ` AND ${c} = '${esc(fsel[c].value)}'` : "").join("");
function refresh() { box.value = PRESETS[sel.value](filt()); run(); }
sel.onchange = refresh;
Object.values(fsel).forEach(el => el.onchange = refresh);

// sortable value: numbers and "850 g" style strings compare numerically
const key = v => {
  if (typeof v === "number") return v;
  const m = typeof v === "string" && v.match(/^-?\d+(\.\d+)?( g)?$/);
  return m ? parseFloat(v) : v;
};
function compare(i) {
  const d = sort.dir === "asc" ? 1 : -1;
  return (x, y) => {
    const a = x[i], b = y[i];
    if (a === null) return 1;
    if (b === null) return -1;
    const ka = key(a), kb = key(b);
    return (ka < kb ? -1 : ka > kb ? 1 : 0) * d;
  };
}

function render(ms) {
  out.replaceChildren();
  if (!last) { status.className = "ok"; status.textContent = "Query OK, no rows."; return; }
  const { columns, values } = last;
  const rows = sort.col >= 0 ? [...values].sort(compare(sort.col)) : values;
  const table = document.createElement("table");
  const thead = table.createTHead().insertRow();
  columns.forEach((c, i) => {
    const th = document.createElement("th");
    th.textContent = c;
    th.className = "sortable" + (typeof values[0]?.[i] === "number" || c === "Weight" ? " num" : "");
    if (sort.col === i) th.dataset.dir = sort.dir;
    th.onclick = () => {
      if (sort.col !== i) sort = { col: i, dir: "asc" };
      else if (sort.dir === "asc") sort.dir = "desc";
      else sort = { col: -1, dir: "asc" };
      render(ms);
    };
    thead.appendChild(th);
  });
  const tbody = table.createTBody();
  rows.forEach(r => {
    const tr = tbody.insertRow();
    r.forEach((v, i) => {
      const td = tr.insertCell();
      td.textContent = v === null ? "NULL" : v;
      if (typeof v === "number" || columns[i] === "Weight") td.className = "num";
      if (columns[i] === "Score" && typeof v === "number") {
        const span = document.createElement("span");
        span.className = "score";
        span.textContent = v.toFixed(2);
        span.style.setProperty("--c", scoreColor(v));
        td.replaceChildren(span);
      }
      if (columns[i] === "Nick" && v !== null) {
        td.className = "nick";
        const span = document.createElement("span");
        span.className = "name";
        span.title = "Filter by " + v;
        span.textContent = v;
        const c = NAME_COLORS[String(v).trim().toLowerCase()];
        if (c) span.style.setProperty("--c", c);
        span.onclick = () => {
          if ([...fsel.Nick.options].some(o => o.value === v)) { fsel.Nick.value = v; refresh(); }
        };
        td.replaceChildren(span);
      }
    });
  });
  out.appendChild(table);
  status.className = "ok";
  status.textContent = `${values.length} rows \u00B7 ${ms} ms`;
}

function run() {
  status.className = "";
  try {
    const t = performance.now();
    const res = db.exec(box.value);
    last = res[0] || null;
    sort = { col: -1, dir: "asc" };
    render(Math.round(performance.now() - t));
  } catch (e) { status.className = "err"; status.textContent = e.message; out.replaceChildren(); }
}

function fillFilters() {
  for (const [c, label] of Object.entries(FILTERS)) {
    const res = db.exec(`SELECT DISTINCT ${c} FROM records WHERE Season = '0_0' AND ${c} IS NOT NULL ORDER BY ${c}`);
    fsel[c].add(new Option("All " + label, ""));
    (res[0]?.values || []).forEach(([v]) => fsel[c].add(new Option(v, v)));
  }
}

(async () => {
  try {
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    const resp = await fetch("pp2_00.db");
    if (!resp.ok) throw new Error(`DB download failed (${resp.status})`);
    db = new SQL.Database(new Uint8Array(await resp.arrayBuffer()));
    runBtn.disabled = false;
    runBtn.onclick = run;
    box.addEventListener("keydown", e => { if (e.ctrlKey && e.key === "Enter") run(); });
    fillFilters();
    refresh();
  } catch (e) {
    status.className = "err";
    status.textContent = e.message;
  }
})();
</script>
</body>
</html>
